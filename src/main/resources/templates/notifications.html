<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Notifications — Sharpen</title></head>
<body>
<main>
  <div class="page-head">
    <div><h1>Notifications</h1><p>What happened on your account. Nothing here is emailed; it waits for you.</p></div>
    <form th:if="${unread > 0}" th:action="@{/notifications/read-all}" method="post" class="row actions no-print">
      <button class="btn small" type="submit">Mark all as read</button>
    </form>
  </div>

  <div class="card" th:if="${#lists.isEmpty(items)}">
    <p class="empty">Nothing yet. You will hear here when a friend joins from your link or a monthly report is ready.</p>
  </div>

  <ul class="notes" th:unless="${#lists.isEmpty(items)}">
    <li th:each="n : ${items}" th:classappend="${n.unread} ? 'unread'">
      <a th:href="@{/notifications/{id}(id=${n.id})}">
        <span class="dot" aria-hidden="true"></span>
        <span class="text">
          <b th:text="${n.title}">A friend joined</b>
          <span th:if="${n.body}" th:text="${n.body}">Omar Haddad created an account from your invitation link.</span>
          <small th:text="${#temporals.format(n.createdAt, 'd MMM yyyy, HH:mm')}">20 Oct 2026, 09:12</small>
        </span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
