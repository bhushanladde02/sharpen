# Production on one small VM: PostgreSQL + Sharpen + Caddy (automatic HTTPS).
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# The app image comes from one of two places:
#   * built here on the VM from the source tree (`up --build`, the manual path) — tagged sharpen-app:local;
#   * pulled from the registry, when APP_IMAGE is set (the pipeline's path, see .github/workflows/deploy.yml):
#       APP_IMAGE=ghcr.io/bhushanladde02/sharpen:<sha> docker compose ... up -d --no-build --pull always app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharpen
      POSTGRES_USER: sharpen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/main/resources/db/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharpen"]
      interval: 5s
      retries: 12
    # The VM is shared (BotSpotter's stack has ~2.4 GB of limits of its own). A ceiling per container keeps one
    # project from starving the other; measured use on day 41: ~55 MB.
    mem_limit: 512m

  app:
    image: ${APP_IMAGE:-sharpen-app:local}
    build:
      context: ..
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SHARPEN_DB_URL: jdbc:postgresql://db:5432/sharpen
      SHARPEN_DB_USER: sharpen
      SHARPEN_DB_PASSWORD: ${DB_PASSWORD}
      SHARPEN_DEMO_DATA: ${DEMO_DATA:-false}
      SHARPEN_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SHARPEN_SITE_HOST: ${DOMAIN}
      # "Continue with Google / GitHub / LinkedIn": each provider appears only when both its values are set in deploy/.env.
      SHARPEN_OAUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SHARPEN_OAUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SHARPEN_OAUTH_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      SHARPEN_OAUTH_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SHARPEN_OAUTH_LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      SHARPEN_OAUTH_LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      SHARPEN_MAIL_RESEND_API_KEY: ${RESEND_API_KEY:-}
      SHARPEN_MAIL_FROM: ${MAIL_FROM:-Sharpen <invites@sharpenscore.com>}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    # Without a limit MaxRAMPercentage=60 is 60 % of the whole VM (3.5 GB of 6) — more than the JVM should ever take
    # on a box it shares. 1.5 GB gives it ~900 MB of heap; measured use on day 41 was ~400 MB in all.
    mem_limit: 1536m
    # "healthy" / "unhealthy" in `docker ps`, and what deploy/watchdog.sh acts on. Docker does not restart an
    # unhealthy container by itself; the watchdog does.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      # DB-IP's country list (~8 MB), downloaded by the app monthly, kept across restarts and redeploys
      - geodata:/app/data/geo
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  geodata:
  caddy_data:
  caddy_config:
