name: Deploy

# Stage 2 of the pipeline. Runs after "CI" has passed on main (or by hand from the Actions tab):
#   1. image   — package the jar, wrap it in a JRE image for arm64 + amd64, push to GitHub's registry (GHCR)
#                as ghcr.io/<owner>/sharpen:<short-sha> and :latest.
#   2. deploy  — over SSH to the production VM: sync the repo to this commit, pull the image, restart the app,
#                wait for /api/v1/health, roll back to the previous image if it never comes up.
# The deploy job ends early (green, "not configured") until the DEPLOY_* secrets exist, so the pipeline is safe
# to merge before the VM does. Secrets live in Settings → Environments → production (see docs/deployment) and
# are only visible to a job that declares that environment — which is why the check happens inside "deploy".
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build and deploy
        default: main
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never interrupt a rollout half-way

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sharpen

jobs:
  image:
    name: Build and publish the image
    # workflow_run fires for failed CI runs too; only continue when CI succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.fullsha.outputs.sha }}
      tag: ${{ steps.fullsha.outputs.tag }}
    steps:
      - name: Resolve the commit to deploy
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then sha="${{ github.event.workflow_run.head_sha }}"
          else sha="${{ inputs.ref }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - name: Pin the exact commit (a branch name resolves to one here)
        id: fullsha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package the jar (tests already ran in CI)
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for arm64 (Oracle A1) and amd64, push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.fullsha.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.fullsha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Published \`${IMAGE}:${{ steps.fullsha.outputs.tag }}\` (and \`:latest\`) for linux/arm64 and linux/amd64." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Roll out to production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN || 'sharpenscore.com' }}
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Is the production VM configured?
        id: gate
        run: |
          if [ -n "$HOST" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"
          else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "Production VM not configured yet (no DEPLOY_HOST / DEPLOY_SSH_KEY secrets in the production environment) — nothing rolled out." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          ref: ${{ needs.image.outputs.sha }}
      - name: Install the SSH key
        if: steps.gate.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 20
          EOF
      - name: Sync the checkout on the VM to this commit
        if: steps.gate.outputs.configured == 'true'
        run: |
          ssh vm 'set -e; cd ~/sharpen; git fetch -q origin; git reset -q --hard ${{ needs.image.outputs.sha }}; git log -1 --oneline'
      - name: Let the VM pull from GHCR (only needed while the package is private)
        if: steps.gate.outputs.configured == 'true' && env.GHCR_PULL_TOKEN != ''
        run: printf '%s' "$GHCR_PULL_TOKEN" | ssh vm "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"
      - name: Pull the image, restart, wait for health (roll back on failure)
        if: steps.gate.outputs.configured == 'true'
        run: ssh vm "APP_IMAGE=${IMAGE}:${{ needs.image.outputs.tag }} bash ~/sharpen/deploy/remote-deploy.sh"
      - name: Summary
        if: steps.gate.outputs.configured == 'true'
        run: echo "Deployed \`${IMAGE}:${{ needs.image.outputs.tag }}\` (commit ${{ needs.image.outputs.sha }}) to \`$HOST\`." >> "$GITHUB_STEP_SUMMARY"
