<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Feedback inbox — Sharpen</title></head>
<body>
<main>
  <div class="page-head">
    <div><p class="eyebrow">Owner only</p><h1>Feedback inbox</h1><p>Latest 200 messages, newest first.</p></div>
  </div>
  <div class="grid four" style="margin-bottom:1rem">
    <div class="card stat"><span class="label">Members</span><span class="value num" th:text="${stats.members}">0</span></div>
    <div class="card stat"><span class="label">Companies</span><span class="value num" th:text="${stats.companies}">0</span></div>
    <div class="card stat"><span class="label">Sessions logged</span><span class="value num" th:text="${stats.sessions}">0</span></div>
    <div class="card stat"><span class="label">Reports generated</span><span class="value num" th:text="${stats.reports}">0</span></div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table class="stackable">
        <thead><tr><th>Date</th><th class="num">Rating</th><th>Message</th><th>From</th><th>Page</th></tr></thead>
        <tbody>
        <tr th:each="f : ${items}">
          <td class="num" data-label="Date" th:text="${f.createdOn}">2026-09-07</td>
          <td class="num" data-label="Rating" th:text="${f.rating != null} ? ${f.rating} + '/5' : '—'">4/5</td>
          <td data-label="Message" th:text="${f.message}" style="white-space:pre-wrap;max-width:60ch">Message</td>
          <td data-label="From" th:text="${f.email} ?: (${f.personId != null} ? 'member #' + ${f.personId} : 'anonymous')">who</td>
          <td data-label="Page" class="muted" th:text="${f.page}">/dashboard</td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="empty" data-label="">Nothing yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
