name: CodeQL

# Static security analysis of the Java code and the workflow files. Runs on pushes and PRs to main and once a
# week; findings appear under Security → Code scanning. Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build (CodeQL watches the compiler)
        if: matrix.language == 'java-kotlin'
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
