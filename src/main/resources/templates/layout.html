<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
  <title th:replace="${title}">Sharpen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" th:href="@{/css/sharpen.css}">
</head>
<body>
<div class="shell" th:classappend="${me == null} ? 'public'">
  <!-- Mobile top bar -->
  <header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark"></span> Sharpen</a>
    <span class="grow"></span>
    <nav class="nav" th:if="${me == null}"><a th:href="@{/login}">Sign in</a><a class="btn primary small" th:href="@{/register}">Create account</a></nav>
    <label class="menu-toggle" for="nav-open" aria-label="Menu" th:if="${me != null}"><span></span></label>
  </header>
  <input type="checkbox" id="nav-open" aria-hidden="true">

  <!-- Drawer on mobile, sidebar on desktop -->
  <aside class="drawer">
    <a class="brand" th:href="@{/}"><span class="brand-mark"></span> Sharpen</a>
    <nav class="nav" th:replace="~{nav :: navlinks}"></nav>
    <div class="spacer"></div>
    <div class="nav" th:if="${me != null}">
      <div class="who"><b th:text="${me.displayName}">Name</b><span th:text="${me.company} ? 'Company account' : ('sharpen.io/p/' + ${me.handle})">handle</span></div>
      <div class="who counter" style="border-top:0;padding-top:0">
        <b><span class="num" data-count="members" th:text="${#numbers.formatInteger(community.members, 1, 'COMMA')}">0</span> members</b>
        <span><span class="num" data-count="sessions" th:text="${#numbers.formatInteger(community.sessions, 1, 'COMMA')}">0</span> sessions logged</span>
      </div>
      <div class="row" style="gap:.4rem">
        <form th:action="@{/logout}" method="post"><button class="btn small" type="submit">Sign out</button></form>
        <a class="btn small" th:href="@{/feedback(from=${path})}">Feedback</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <div th:if="${flash}" class="flash" th:text="${flash}">Saved.</div>
    <th:block th:replace="${content}"/>
  </main>

  <!-- Phone tab bar: the four things people do most -->
  <nav class="tabbar" th:if="${me != null and !me.company}" th:with="p=${path ?: ''}" aria-label="Quick navigation">
    <a th:href="@{/dashboard}" th:classappend="${p == '/dashboard'} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a th:href="@{/sessions}" th:classappend="${p == '/sessions'} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Sessions</a>
    <a th:href="@{/sessions/new}" class="fab" aria-label="Log a session">
      <span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a th:href="@{/reports}" th:classappend="${#strings.startsWith(p, '/reports')} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6M9 13h6M9 17h6"/></svg>Reports</a>
    <a th:href="@{/p/{h}(h=${me.handle})}" th:classappend="${#strings.startsWith(p, '/p/')} ? 'active'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>
</div>
<script>
  // Live community counter: refresh every 30 s from the open stats endpoint. Degrades to the server-rendered number.
  (function () {
    var els = document.querySelectorAll('[data-count]');
    if (!els.length) return;
    function tick() {
      fetch('/api/v1/public/stats', { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (s) {
          if (!s) return;
          els.forEach(function (el) {
            var v = s[el.getAttribute('data-count')];
            if (typeof v === 'number') el.textContent = v.toLocaleString();
          });
        }).catch(function () {});
    }
    setInterval(tick, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  })();
</script>
</body>
</html>
