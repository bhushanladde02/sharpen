name: Release

# Pushing a tag like v0.1.0 builds the jar and attaches it to a GitHub Release, so a version can be
# downloaded and run anywhere with `java -jar`. The container image for the same commit is already on GHCR
# from the Deploy workflow; this adds the plain jar and release notes.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - name: Name the jar after the tag
        run: cp target/sharpen.jar "sharpen-${GITHUB_REF_NAME}.jar"
      - name: Create the GitHub Release with the jar attached
        uses: softprops/action-gh-release@v2
        with:
          files: sharpen-${{ github.ref_name }}.jar
          generate_release_notes: true
