<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5665"/></marker></defs><rect width="1000" height="430" fill="#f4f5f8" rx="16"/><text x="20" y="30" text-anchor="start" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#12171f">From git push to the live site: the GitHub Actions pipeline</text>
<rect x="30" y="90" width="130" height="64" rx="10" fill="#ffffff" stroke="#d9dfe8" stroke-width="1.2"/>
<text x="95.0" y="112.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">git push</text>
<text x="95.0" y="129.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">any branch, or a</text>
<text x="95.0" y="143.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">pull request</text>
<path d="M160 122 L208 122" fill="none" stroke="#4a5665" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="206" y="50" width="380" height="300" rx="14" fill="#eceff4" stroke="#d9dfe8" stroke-width="1.2"/>
<text x="220" y="70" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" fill="#7c8794">STAGE 1 - CI  (CI.YML)</text>
<rect x="224" y="90" width="160" height="62" rx="10" fill="#e6ecfc" stroke="#2857d9" stroke-width="1.2"/>
<text x="304.0" y="111.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">Build and test</text>
<text x="304.0" y="128.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">mvn verify: 14 unit +</text>
<text x="304.0" y="142.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">MockMvc tests</text>
<rect x="404" y="90" width="164" height="62" rx="10" fill="#e6ecfc" stroke="#2857d9" stroke-width="1.2"/>
<text x="486.0" y="111.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">Docs</text>
<text x="486.0" y="128.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">sphinx-build -W, zero</text>
<text x="486.0" y="142.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">warnings</text>
<path d="M304 152 L304 190" fill="none" stroke="#4a5665" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="224" y="192" width="344" height="76" rx="10" fill="#e6ecfc" stroke="#2857d9" stroke-width="1.2"/>
<text x="396.0" y="213.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">Boot and serve (smoke)</text>
<text x="396.0" y="230.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">starts the real jar, requests every public page,</text>
<text x="396.0" y="244.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">signs in, downloads a report PDF, calls the API with</text>
<text x="396.0" y="258.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">a key</text>
<text x="396" y="300" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4a5665">All three green on main  -&gt;  Stage 2 starts automatically</text>
<text x="396" y="318" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4a5665">Red anywhere  -&gt;  nothing is deployed; the PR shows what failed</text>
<path d="M586 200 L632 200" fill="none" stroke="#4a5665" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="630" y="50" width="350" height="300" rx="14" fill="#eceff4" stroke="#d9dfe8" stroke-width="1.2"/>
<text x="644" y="70" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" fill="#7c8794">STAGE 2 - DEPLOY  (DEPLOY.YML)</text>
<rect x="648" y="90" width="314" height="62" rx="10" fill="#e2f4e6" stroke="#0f7a2b" stroke-width="1.2"/>
<text x="805.0" y="111.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">Build and publish the image</text>
<text x="805.0" y="128.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">jar + JRE for arm64 and amd64 -&gt;</text>
<text x="805.0" y="142.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">ghcr.io/&lt;owner&gt;/sharpen:&lt;commit&gt;</text>
<path d="M805 152 L805 190" fill="none" stroke="#4a5665" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="648" y="192" width="314" height="96" rx="10" fill="#e2f4e6" stroke="#0f7a2b" stroke-width="1.2"/>
<text x="805.0" y="216.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#12171f">Roll out to production</text>
<text x="805.0" y="233.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">over SSH to the VM: sync repo to the commit,</text>
<text x="805.0" y="247.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">pull image, docker compose up, wait for</text>
<text x="805.0" y="261.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">/api/v1/health; roll back to the previous image</text>
<text x="805.0" y="275.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">if it never answers</text>
<text x="805" y="318" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4a5665">Skipped, not failed, until the DEPLOY_* secrets exist</text>
<rect x="30" y="190" width="130" height="150" rx="10" fill="#ffffff" stroke="#d9dfe8" stroke-width="1.2"/>
<text x="95.0" y="220.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#12171f">Also</text>
<text x="95.0" y="237.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">CodeQL scan weekly</text>
<text x="95.0" y="251.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">and on PRs;</text>
<text x="95.0" y="265.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">Dependabot PRs for</text>
<text x="95.0" y="279.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">Maven, Actions,</text>
<text x="95.0" y="293.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">Docker; a v* tag</text>
<text x="95.0" y="307.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">makes a Release</text>
<text x="95.0" y="321.5" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5665">with the jar</text>
<text x="500" y="392" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4a5665">Every step is a file in .github/workflows; the VM-side script is deploy/remote-deploy.sh.</text></svg>
