spring:
  application:
    name: sharpen
  datasource:
    url: jdbc:h2:file:./data/sharpen;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    format:
      date: iso            # form dates are exchanged as yyyy-MM-dd, what <input type="date"> expects
  jackson:
    default-property-inclusion: non_null

# "Continue with Google / GitHub / LinkedIn" — sharpen.oauth.{google,github,linkedin}.client-id / client-secret, normally from the
# environment (SHARPEN_OAUTH_GOOGLE_CLIENT_ID, …; see deploy/.env.example). Unset means the provider is not offered.

server:
  port: 8080
  # Behind Caddy: Tomcat's RemoteIpValve takes the client address and scheme from X-Forwarded-For / -Proto, but
  # only when the request comes from a private-network address (the Docker network), so a visitor cannot spoof
  # either header. With the scheme known to be https, the session cookie gets Secure and redirects stay on https.
  # Without a proxy (development) nothing changes.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax     # the cookie is not sent on cross-site POSTs; ordinary links into the site still work
        http-only: true
  compression:
    enabled: true
  error:
    include-message: never   # the error page writes its own hints; framework messages never reach a visitor

sharpen:
  demo-data: true
  # Email. Sharpen sends only one kind: an invitation a member asked for (InviteService). Off unless a Resend API
  # key is set (SHARPEN_MAIL_RESEND_API_KEY; the From domain must be verified in Resend) — then every "Send from
  # Sharpen" button appears. log: true writes the message to the log instead of sending (development and tests).
  mail:
    resend-api-key: ${SHARPEN_MAIL_RESEND_API_KEY:}
    from: ${SHARPEN_MAIL_FROM:Sharpen <invites@sharpenscore.com>}
    daily-limit: 80      # site-wide ceiling for a day; Resend's free plan allows 100
    log: true
  # Host shown in profile links and the PDF footer; the web pages use the request's Host header instead.
  site-host: ${SHARPEN_SITE_HOST:localhost:8080}
  # The account allowed to read /admin/feedback. Set SHARPEN_ADMIN_EMAIL in production.
  admin-email: ${SHARPEN_ADMIN_EMAIL:demo@sharpen.io}
  # Country of each page view, from DB-IP's free "IP to Country Lite" list (CC BY 4.0) held on disk and searched in
  # memory; the address itself is never stored. download: fetch it monthly from db-ip.com (production turns it on).
  geo:
    file: ${SHARPEN_GEO_FILE:data/geo/dbip-country-lite.csv.gz}
    download: ${SHARPEN_GEO_DOWNLOAD:false}

logging:
  level:
    io.sharpen: INFO
    org.hibernate.SQL: WARN
    com.openhtmltopdf: WARN   # PDF renderer is chatty at INFO (parser, timings, "prepare to fly")
