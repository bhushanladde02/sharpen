# Production on one small VM: PostgreSQL + Sharpen + Caddy (automatic HTTPS).
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# The app image comes from one of two places:
#   * built here on the VM from the source tree (`up --build`, the manual path) — tagged sharpen-app:local;
#   * pulled from the registry, when APP_IMAGE is set (the pipeline's path, see .github/workflows/deploy.yml):
#       APP_IMAGE=ghcr.io/bhushanladde02/sharpen:<sha> docker compose ... up -d --no-build --pull always app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharpen
      POSTGRES_USER: sharpen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/main/resources/db/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharpen"]
      interval: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:-sharpen-app:local}
    build:
      context: ..
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SHARPEN_DB_URL: jdbc:postgresql://db:5432/sharpen
      SHARPEN_DB_USER: sharpen
      SHARPEN_DB_PASSWORD: ${DB_PASSWORD}
      SHARPEN_DEMO_DATA: ${DEMO_DATA:-false}
      SHARPEN_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SHARPEN_SITE_HOST: ${DOMAIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
