name: CI

# Stage 1 of the pipeline (stage 2 is deploy.yml). Runs on every push and pull request. Three gates:
# the unit + MockMvc suite; the real jar booted with demo data and asked for the public pages, a signed-in
# dashboard and a report PDF; and the Sphinx documentation building with warnings as errors.
# When all three pass on main, deploy.yml builds the container image and rolls it out.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the test suite
        run: mvn -B --no-transfer-progress verify
      - name: Summarise the test results
        if: always()
        run: |
          {
            echo "### Test results"; echo
            echo "| Suite | Tests | Failures | Errors | Skipped |"; echo "|---|---:|---:|---:|---:|"
            total=0; fails=0; errs=0
            for f in target/surefire-reports/TEST-*.xml; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .xml); name=${name#TEST-io.sharpen.}
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
              fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
              er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
              sk=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
              echo "| \`$name\` | $t | $fl | $er | $sk |"
              total=$((total + t)); fails=$((fails + fl)); errs=$((errs + er))
            done
            echo; echo "**$total tests, $fails failures, $errs errors.**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
      - name: Upload the runnable jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sharpen-jar
          path: target/sharpen.jar
          retention-days: 14

  smoke:
    name: Boot and serve
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package without re-running the tests
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Start the application with demo data
        run: |
          nohup java -jar target/sharpen.jar --server.port=8099 > app.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Seeded demo accounts" app.log && exit 0
            sleep 2
          done
          echo "The application did not start within two minutes."; tail -50 app.log; exit 1
      - name: Request every public page
        run: |
          fail=0
          for path in / /login /register /p/priya-natarajan /p/does-not-exist /api/v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            case "$code" in
              200) printf '  ok  %-24s %s\n' "$path" "$code" ;;
              *)   printf 'FAIL  %-24s %s\n' "$path" "$code"; fail=1 ;;
            esac
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/dashboard)
          [ "$code" = "302" ] && echo "  ok  /dashboard redirects anonymous ($code)" || { echo "FAIL /dashboard $code"; fail=1; }
          exit $fail
      - name: Sign in, open the dashboard, download a report PDF
        run: |
          set -e
          jar=cookies.txt
          token=$(curl -s -c $jar http://localhost:8099/login | grep -o 'name="_csrf" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          curl -s -o /dev/null -c $jar -b $jar -X POST http://localhost:8099/login \
            -d "_csrf=$token&username=demo@sharpen.io&password=demo1234"
          curl -s -b $jar http://localhost:8099/dashboard -o dash.html
          grep -q "AI score" dash.html && echo "  dashboard: ok" || { echo "FAIL dashboard"; head -40 dash.html; exit 1; }
          ym=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          curl -s -b $jar "http://localhost:8099/reports/$ym.pdf" -o report.pdf
          file report.pdf | grep -q "PDF document" || { echo "The PDF export did not produce a PDF."; exit 1; }
          echo "  PDF export: ok ($(wc -c < report.pdf) bytes)"
          key=$(curl -s -b $jar http://localhost:8099/settings | grep -o 'shp_[0-9a-f]*' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Api-Key: $key" http://localhost:8099/api/v1/me/score)
          [ "$code" = "200" ] && echo "  API with key: ok" || { echo "FAIL api $code"; exit 1; }
      - name: Show the application log if anything failed
        if: failure()
        run: tail -100 app.log

  docs:
    name: Documentation builds cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Build with warnings as errors (same as docs/view.sh)
        run: sphinx-build -W -q -b html docs docs/_build/html
      - name: Upload the rendered documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
