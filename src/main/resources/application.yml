spring:
  application:
    name: sharpen
  datasource:
    url: jdbc:h2:file:./data/sharpen;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    format:
      date: iso            # form dates are exchanged as yyyy-MM-dd, what <input type="date"> expects
  jackson:
    default-property-inclusion: non_null

# "Continue with Google / GitHub" — sharpen.oauth.{google,github}.client-id / client-secret, normally from the
# environment (SHARPEN_OAUTH_GOOGLE_CLIENT_ID, …; see deploy/.env.example). Unset means the provider is not offered.

server:
  port: 8080
  # Behind Caddy: Tomcat's RemoteIpValve takes the client address and scheme from X-Forwarded-For / -Proto, but
  # only when the request comes from a private-network address (the Docker network), so a visitor cannot spoof
  # either header. With the scheme known to be https, the session cookie gets Secure and redirects stay on https.
  # Without a proxy (development) nothing changes.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax     # the cookie is not sent on cross-site POSTs; ordinary links into the site still work
        http-only: true
  compression:
    enabled: true
  error:
    include-message: always

sharpen:
  demo-data: true
  # Host shown in profile links and the PDF footer; the web pages use the request's Host header instead.
  site-host: ${SHARPEN_SITE_HOST:localhost:8080}
  # The account allowed to read /admin/feedback. Set SHARPEN_ADMIN_EMAIL in production.
  admin-email: ${SHARPEN_ADMIN_EMAIL:demo@sharpen.io}

logging:
  level:
    io.sharpen: INFO
    org.hibernate.SQL: WARN
    com.openhtmltopdf: WARN   # PDF renderer is chatty at INFO (parser, timings, "prepare to fly")
